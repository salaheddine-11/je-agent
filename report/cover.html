<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 210mm; height: 297mm; box-sizing: border-box;
    background: #fbfaf8;
    color: #1f1e1c;
    font-family: Georgia, "Times New Roman", serif;
    position: relative;
    padding: 24mm 26mm;
    display: flex; flex-direction: column;
  }
  /* top band */
  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 0.45mm solid #1f1e1c;
    padding-bottom: 5mm;
  }
  .brand {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 10.5pt; font-weight: 700;
    letter-spacing: .34em; text-transform: uppercase;
  }
  .year {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 9pt; color: #78716c; letter-spacing: .12em;
  }
  /* middle */
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-size: 41pt; font-weight: 400; font-style: italic;
    line-height: 1.14; letter-spacing: -0.01em;
    margin: 0 0 12mm;
  }
  h1 b { font-style: normal; font-weight: 700; }
  .kicker {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 9.5pt; letter-spacing: .30em; text-transform: uppercase;
    color: #b45309; margin: 0 0 6mm;
  }
  .project {
    font-size: 13.5pt; color: #44403c; margin: 0;
  }
  .project b { font-weight: 700; }
  /* bottom */
  .bottom {
    border-top: 0.45mm solid #d6d3d1;
    padding-top: 6mm;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .author-label {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 8pt; letter-spacing: .26em; text-transform: uppercase;
    color: #a8a29e; margin-bottom: 2mm;
  }
  .author { font-size: 16pt; font-weight: 700; }
  .meta {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 9pt; color: #a8a29e; text-align: right; line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">JE Agent</div>
    <div class="year">2026</div>
  </div>

  <div class="mid">
    <p class="kicker">Project Report</p>
    <h1>Journal-entry<br>testing,<br><b>decided.</b></h1>
    <p class="project"><b>JE Agent</b> — Journal Entry Testing AI Agent<br>per ISA 240 / AS 2401</p>
  </div>

  <div class="bottom">
    <div>
      <div class="author-label">Prepared by</div>
      <div class="author">Salah Eddine</div>
    </div>
    <div class="meta">
      version 1.1<br>confidential draft
    </div>
  </div>
</body>
</html>
